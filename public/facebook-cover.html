<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 820px;
      height: 462px;
      overflow: hidden;
    }

    .cover {
      width: 820px;
      height: 462px;
      position: relative;
      background:
        radial-gradient(ellipse 70% 80% at 80% 50%, #2c1c0c 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 15% 30%, #221408 0%, transparent 55%),
        #18100a;
      display: flex;
      align-items: center;
    }

    /* Elemento tipográfico de fondo */
    .bg-glyph {
      position: absolute;
      right: -30px;
      top: 50%;
      transform: translateY(-50%) rotate(5deg);
      font-family: 'Cormorant Garamond', serif;
      font-size: 420px;
      font-weight: 300;
      color: #c49a3c;
      line-height: 1;
      opacity: 0.055;
      user-select: none;
      letter-spacing: -10px;
    }

    /* Línea vertical de acento */
    .accent {
      position: absolute;
      left: 56px;
      top: 48px;
      bottom: 48px;
      width: 1px;
      background: linear-gradient(to bottom,
        transparent,
        rgba(196,154,60,0.4) 20%,
        rgba(196,154,60,0.4) 80%,
        transparent);
    }

    /* Contenido */
    .content {
      position: relative;
      z-index: 1;
      padding-left: 84px;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #c49a3c;
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 68px;
      font-weight: 300;
      color: #f3e8d3;
      line-height: 1;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 300;
      font-style: italic;
      color: #a89070;
      line-height: 1.5;
      max-width: 380px;
    }

    /* Estrellas decorativas pequeñas */
    .star-group {
      position: absolute;
      right: 120px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0.3;
    }

    /* Viñeta */
    .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="bg-glyph">✦</div>
    <div class="accent"></div>

    <div class="content">
      <div class="eyebrow">Astrología · Numerología</div>
      <div class="brand">Cosmyastral</div>
      <div class="tagline">Tu carta natal y numerología<br>narradas con cuidado</div>
    </div>

    <!-- Estrellas decorativas -->
    <div class="star-group">
      <svg width="22" height="22" viewBox="0 0 32 32">
        <path d="M16 5 L17.4 12.2 L24 10 L19.8 15.2 L24 16 L19.8 16.8 L24 22 L17.4 19.8 L16 27 L14.6 19.8 L8 22 L12.2 16.8 L8 16 L12.2 15.2 L8 10 L14.6 12.2 Z" fill="#c49a3c"/>
      </svg>
      <svg width="10" height="10" viewBox="0 0 32 32">
        <path d="M16 5 L17.4 12.2 L24 10 L19.8 15.2 L24 16 L19.8 16.8 L24 22 L17.4 19.8 L16 27 L14.6 19.8 L8 22 L12.2 16.8 L8 16 L12.2 15.2 L8 10 L14.6 12.2 Z" fill="#c49a3c"/>
      </svg>
      <svg width="16" height="16" viewBox="0 0 32 32">
        <path d="M16 5 L17.4 12.2 L24 10 L19.8 15.2 L24 16 L19.8 16.8 L24 22 L17.4 19.8 L16 27 L14.6 19.8 L8 22 L12.2 16.8 L8 16 L12.2 15.2 L8 10 L14.6 12.2 Z" fill="#c49a3c"/>
      </svg>
    </div>

  </div>
</body>
</html>
